# Contributor Licence Agreement gate.
#
# WHY THIS EXISTS
# x is dual-licensed: AGPL-3.0 for everyone, and a commercial licence for anyone
# who cannot publish their modifications. Offering the second one requires
# holding the rights to the whole codebase — so a contribution merged without a
# signed CLA is code that can never be included in a commercial licence, and
# there is no way to fix that later short of rewriting it or tracking the author
# down. Hence a gate rather than a note in CONTRIBUTING.md.
#
# WHY THE ACTION AND NOT THE HOSTED APP
# `contributor-assistant/github-action` runs in this repository, stores its
# signature file in this organisation, and is visible in this diff. The hosted
# CLA Assistant needs an org-wide app install with write access, granted out of
# band, that nobody reviewing the repo can see. For a project whose whole
# argument is "the skeleton is in git", the in-repo one is the honest choice.
#
# SETUP, ONCE
#   1. Create an EMPTY private repo in this org named `cla-signatures`.
#      Signatures are names, GitHub handles and timestamps — they do not belong
#      in the public repo.
#   2. Create a Personal Access Token with `repo` scope on that repo and save it
#      as the `PERSONAL_ACCESS_TOKEN` secret here.
#   3. Merge this file. The next external PR gets the prompt automatically.
#
# Maintainers are exempt via `allowlist` — they are the copyright holders.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only two things should wake this: the signature comment, or a PR.
    if: >
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes to the separate signatures repo, never to this one.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          branch: main
          path-to-document: https://github.com/GTMinions/x/blob/main/CLA.md
          path-to-signatures: signatures/v1.json
          remote-organization-name: GTMinions
          remote-repository-name: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request.


            Before this can be merged, please read [the CLA](https://github.com/GTMinions/x/blob/main/CLA.md)
            and sign it by posting exactly this as a comment:


            `I have read the CLA Document and I hereby sign the CLA`


            **Why:** x is dual-licensed — AGPL-3.0 for everyone, plus a commercial
            licence for people who cannot publish their changes. Offering that second
            licence means the project has to hold the rights to all of the code. The CLA
            grants those rights while **you keep your copyright**; it is not an
            assignment. It is short, and this is the only time you will be asked.
          custom-allsigned-prcomment: >
            CLA signed — thank you. Reviewing shortly.
